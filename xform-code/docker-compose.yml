version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bookstore-postgres
    environment:
      POSTGRES_DB: BookStoreClassic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  bookstore-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstore-web
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__BookstoreDatabaseConnection=Host=postgres;Database=BookStoreClassic;Username=postgres;Password=postgres
      - AppSettings__Services/Authentication=local
      - AppSettings__Services/Database=local
      - AppSettings__Services/FileService=local
      - AppSettings__Services/ImageValidationService=local
      - AppSettings__Services/LoggingService=local
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bookstore_files:/app/wwwroot/images

volumes:
  postgres_data:
  bookstore_files:
